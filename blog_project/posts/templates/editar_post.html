{% extends "base.html" %}

{% block content %}

<h1>Editar post</h1>

<form method="POST">

    {% csrf_token %}

    <label>Título:</label>

    <input
        type="text"
        name="titulo"
        value="{{ post.titulo }}"
    >

    <br><br>

    <label>Contenido:</label>

    <textarea name="contenido" id="contenido">{{ post.contenido }}</textarea>

    <br><br>


    <button type="submit">
        Guardar cambios
    </button>

</form>

{% endblock %}
