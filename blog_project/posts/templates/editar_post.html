{% extends "base.html" %}

{% block content %}

<h1>Editar post</h1>

<form method="POST">

    {% csrf_token %}

    <label>Título:</label>

    <input
        type="text"
        name="titulo"
        value="{{ post.titulo }}"
    >

    <br><br>

    <label>Contenido:</label>

    <textarea name="contenido" id="contenido">{{ post.contenido }}</textarea>

    <br><br>
    {% if post.imagen %}
     <p>Imagen actual:</p>
     <img src="{{post.imagen.url}}" alt="Imagen del post">
    {% endif %}

    <div>
        <label for="imagen" class="form-control">
            Cambiar imagen
        </label>
        <input type="file" name="imagen" id="imagen" class="form-control" accept="image/*">
    </div>


    <button type="submit">
        Guardar cambios
    </button>

</form>

{% endblock %}
