
{%extends "base.html"%}
{%block title%}
Mi perfil
{% endblock %}

{% block content %}
<h1>Mi perfil</h1>
{% if autor.avatar%}
<div>
    <img src="{{autor.avatar.url}}" alt="Mi avatar" width="100" height="100" class="rounded-circle">
</div>
{% else %}
<p>Todavia no tenes un avatar</p>
{% endif %}

<p><strong>Usuario:</strong>{{autor.username}}</p>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
   {{ form.as_p }}
   <button type="submit">Guardar los cambios</button>
   <a href="{% url 'inicio' %}">Cancelar</a>
</form>


{%endblock%}
