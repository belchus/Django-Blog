{% extends "base.html" %}

{% block content %}

<h1>Nuevo post</h1>

<form method="POST">

    {% csrf_token %}

    <label>Título:</label>

    <input
        type="text"
        name="titulo"
    >

    <br><br>

    <label>Contenido: <textarea name="contenido" id="contenido"></textarea></label>
    <br><br>

  

    <br><br>
    <div>
        <label for="imagen">
            Imagen del post
        </label>
        <input type="file" name="imagen" id="imagen" class="form-control" accept="image/*">
    </div>

    <button type="submit">
        Crear post
    </button>

</form>

{% endblock %}
