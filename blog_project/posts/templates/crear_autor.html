{% extends "base.html" %}

{% block content %}

<h1>Nuevo autor</h1>

<form method="POST">

    {% csrf_token %}

    <label>Nombre:</label>

    <input
        type="text"
        name="nombre"
    >

    <br><br>

    <label>Apellido:</label>

    <input
        type="text"
        name="apellido"
    >

    <br><br>
    <label>Email:</label>

    <input
        type="text"
        name="email"
    >

    <br><br>
    <label>Username:</label>

    <input
        type="text"
        name="username"
    >

    <br><br>
    <label>Password:</label>

    <input
        type="text"
        name="password"
    >

    <br><br>

    <button type="submit">
        Crear autor
    </button>

</form>

{% endblock %}
