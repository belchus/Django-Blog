{% extends "base.html" %}

{% block content %}

<h1>{{ post.titulo }}</h1>

<p>Autor: {{ post.autor }}</p>

<a href="{% url 'editar_post' post.id %}">
    Editar
</a>

<a href="{% url 'lista_posts' %}">
    Volver
</a>

<form
    method="POST"
    action="{% url 'eliminar_post' post.id %}"
>

    {% csrf_token %}

    <button type="submit">
        Eliminar
    </button>

</form>

{% endblock %}
